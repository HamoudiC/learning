<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <form action="index.php" method="post" enctype="multipart/form-data">

        <label for="username" id="username">Username:</label>
        <input type="text" required minLength="5" maxLength="10" placeholder="Habood"><br>

        <label for="password">Password:</label>
        <input type="text"  id="password" ><br>

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="habood@gmail.com"><br>

        <label for="phone">Phone Number:</label>
        <input type="phone" id="phone" placeholder="123-456-7890" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"><br>

        <label for="bday">Birthday</label>
        <input type="date" id="bday"><br>

        <label for="quantity">Quantity</label>
        <input type="number" id="quantity" min="0" max="99" value="1"><br>

        <label for="title">Title:</label>

        <label for="Mr.">Mr.</label>
        <input type="radio" id="Mr." value="Mr." name="title">

        <label for="Mrs.">Mrs.</label>
        <input type="radio" id="Mrs." value="Mrs." name="title">

        <label for="Ms.">Ms</label>
        <input type="radio" id="Ms." value="Ms." name="title"><br>

        <label for="payment">Paymemt</label>
        <select id="payment">
            <option value="visa">Visa</option>
            <option value="mastercard">MasterCard</option>
            <option value="giftcard">GiftCard</option>
        </select><br>

        <label for="comment">Comment:</label>
        <textarea id="comment" rows="3" cols="25"></textarea><br>

        <label for="file">File:</label>
        <input type="file" id="file" accept="image/png"><br>

        <input type="submit"><br>
        <input type="reset">

    </form>
    
</body>
</html>
