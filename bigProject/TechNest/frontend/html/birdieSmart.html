<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Birdie</title>

    <!-- Default theme link (will be overridden by themeScript if a saved theme exists) -->
    <link rel="stylesheet" href="../css/themeDark.css" id="theme-link">
    <link rel="stylesheet" href="../css/bots.css">
</head>
<body>

    <!-- PAGE TITLE WITH ENERGY AND COUNTER -->
    <div id="page-name">
        Smart Birdie
        <img id="energy" src="../img/lightning.png" alt="energy">
        <span id="counter"></span>
    </div>

    <!-- CHAT AREA -->
    <div id="chatContainer"></div>

    <!-- INPUT BAR WITH PHOTO AND VOICE BUTTONS -->
   <div id="chatbot-input-container">
        
    <input
        type="file" 
        id="unified-file-input" 
        accept="image/*,.pdf,.doc,.docx,.txt,.ppt,.pptx" 
        style="display: none;"
    >
    
    <button type="button" id="photo-btn">📷</button>
    <p id="photo-msg"></p>

    <button type="button" id="voice-btn">🗣️</button>
    <p id="voice-msg"></p>

    <input type="text" id="chatbot-input" placeholder="Ask away!" autocomplete="off">

    <button type="button" id="send-btn">Enter</button>

</div>

    <!-- BACK BUTTON -->
    <button type="button" id="return-to-main" onclick="location.href='../index.html'">Back</button>
    

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>


    <!-- Theme script -->
    <script src="../js/themeScript.js" type="module"></script>

    <!-- Set bot type -->
    <script>
        window.BIRDIE_TYPE = "smart";
    </script>

    <!-- Chat logic -->
    <script src="../js/birdieScript.js" type="module"></script>

</body>
</html>
