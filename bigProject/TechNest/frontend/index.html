<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechNest</title>

  <!-- Theme and main CSS -->
  <link rel="stylesheet" href="./css/themeDark.css" id="theme-link">
  <link rel="stylesheet" href="./css/index.css">
</head>
<body> 

  <!-- SETTINGS BUTTON -->
  <button id="settings-btn">⚙️</button>

  <!-- SETTINGS POPUP -->
  <div id="settings-popup" class="hidden">
    <div id="settings-content">
      <div id="close-settings">✖</div>
      <h2 id="settings-title">Settings</h2>
      <p id="settings-header">More features soon…</p>

      <button id="gradeView" onclick="location.href='../../gradeView/frontend/index.html'">GradeView <img id="york-img" src="./img/york.png" alt="york"></button>
      
      <button id="VelvetHub" onclick="location.href='../../VelvetHub/frontend/index.html'">VelvetHub</button>

      <button id="profileBtn" onclick="location.href='./html/login.html'">View Profile</button>

      <p id="planMsg"></p>
      <button id="upgrade" onclick="location.href='./html/payment.html'"></button>   

      <div class="theme-section">
        <label for="theme-select">Themes:</label>
        <select id="theme-select">
          <option value="themeDark.css">Dark</option>
          <option value="themeLight.css">Light</option>
          <option value="themeCool.css">Cool</option>
          <option value="themeImperial.css">Imperial</option>
          <option value="themeCandy.css">Candy</option>
        </select>

        <footer id="version">V0.6.0-dev</footer>
      </div>
    </div>
  </div>

  <!-- MAIN PAGE CONTENT -->
  <header id="header">
    
    <div id="page-name">TECH NEST</div>
    <div id="welcomeMsg">welcome message</div>
  </header>

  <main>

    
    <div class="tech">
      <button id="tech-bot" onclick="location.href='./html/birdieTech.html'">Tech Birdie</button>
      <p id="tech-bot-hover"></p>
      <p>🐦‍⬛: "Need help with technology? Ask me anything tech related!"</p>
    </div>

    <div class="smart">
      <button id="smart-bot" onclick="location.href='./html/birdieSmart.html'">Smart Birdie</button>
      <p id="smart-bot-hover"></p>
      <p>🕊️: "Good with tech? I can help with complicated questions!"</p>
    </div>

    <div class="general">
      <button id="general-bot" onclick="location.href='./html/birdieWise.html'">Wise Birdie</button>
      <p id="general-bot-hover"></p>
      <p>🦅: "Tech isn't your strong suit? I could help you out!"</p>
    </div>
  </main>

  <footer>
    © 2026 Velvet
  </footer>

  
  <script src="./js/themeScript.js"></script>
  <script type="module" src="./js/welcomeMsg.js"></script>  
  <script src="./js/payment.js"></script>

</body> 
</html>
